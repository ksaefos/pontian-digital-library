name: Build and verify Pontian Library
on:
  push:
    branches: [stabilization-2.4]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned npm dependencies
        run: npm install --no-audit --no-fund
      - name: Assemble local Tiptap and Hyphenopoly assets
        run: npm run build
      - name: Core regression tests
        run: npm test
      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser smoke tests
        run: npm run test:browser
      - name: Commit generated assets to staging branch after passing tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/tiptap/tiptap.bundle.js vendor/hyphenopoly/6.1.0 package-lock.json sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified local editor and hyphenation assets'
            git push
          fi
