name: Build and verify Pontian Library
on:
  push:
    branches: [stabilization-2.4, main]
  pull_request:
    branches: [main, stabilization-2.4]
  workflow_dispatch:
concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned npm dependencies
        run: npm ci --no-audit --no-fund
      - name: Assemble local Tiptap and Hyphenopoly assets
        run: npm run build
      - name: Validate Studio CSP hashes
        run: |
          python3 scripts/set-csp.py
          git diff --exit-code -- admin.html
      - name: Core regression tests
        run: npm test
      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium
      - name: End-to-end browser smoke tests
        run: npm run test:browser
      - name: Commit generated assets to staging branch after passing tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/stabilization-2.4'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vendor/tiptap/tiptap.bundle.js vendor/hyphenopoly/6.1.0 package-lock.json sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'Build verified local editor and hyphenation assets'
            git push
          fi
      - name: Upload verified public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Install selected compatibility browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Reader compatibility
        run: npm run test:compat && npm run test:coordination && npm run test:accessibility && npm run test:glossary && npm run test:import
        env:
          PDL_BROWSER: ${{ matrix.browser }}

  # Deploy one artifact only after all engines pass; data-only Studio commits build too.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
